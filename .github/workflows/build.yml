name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (leer = 0.1.<Build-Nummer>)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build release APK (unsigned)
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          set -e
          VERSION_NAME="${INPUT_VERSION:-0.1.${{ github.run_number }}}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ github.run_number }}"
          ls -l app/build/outputs/apk/release/

      - name: Sign with the updater key
        env:
          UPDATER_KEY_PK8: ${{ secrets.UPDATER_KEY_PK8 }}
          UPDATER_KEY_PEM: ${{ secrets.UPDATER_KEY_PEM }}
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          echo -n "$UPDATER_KEY_PK8" | base64 --decode > updater.pk8
          echo -n "$UPDATER_KEY_PEM" | base64 --decode > updater.x509.pem
          mkdir -p out
          "$BT/apksigner" sign --key updater.pk8 --cert updater.x509.pem \
            --out "out/MasterROM-Updater-$VERSION_NAME.apk" aligned.apk
          rm -f updater.pk8 updater.x509.pem aligned.apk
          "$BT/apksigner" verify --print-certs "out/MasterROM-Updater-$VERSION_NAME.apk" | head -n 3
          "$BT/aapt2" dump badging "out/MasterROM-Updater-$VERSION_NAME.apk" | head -n 1
          sha256sum out/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MasterROM-Updater-${{ env.VERSION_NAME }}
          path: out/*.apk
