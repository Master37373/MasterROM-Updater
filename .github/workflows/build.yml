name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (leer = Inhalt von version.txt)'
        required: false
        default: ''
      publish:
        description: 'Veroeffentlichen (GitHub-Release, Handys bekommen das Update)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.11.1'

      - name: Build release APK (unsigned)
        env:
          INPUT_VERSION: ${{ github.event.inputs.version_name }}
        run: |
          set -e
          # versionName comes from version.txt (bump it for a new release); versionCode is the
          # run number, so every build is newer than the one before (needed for system app updates)
          VERSION_NAME="${INPUT_VERSION:-$(tr -d '[:space:]' < version.txt)}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          gradle --no-daemon :app:assembleRelease \
            -PversionName="$VERSION_NAME" \
            -PversionCode="${{ github.run_number }}"
          ls -l app/build/outputs/apk/release/

      - name: Sign with the updater key
        env:
          UPDATER_KEY_PK8: ${{ secrets.UPDATER_KEY_PK8 }}
          UPDATER_KEY_PEM: ${{ secrets.UPDATER_KEY_PEM }}
        run: |
          set -e
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)"
          UNSIGNED="$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          echo -n "$UPDATER_KEY_PK8" | base64 --decode > updater.pk8
          echo -n "$UPDATER_KEY_PEM" | base64 --decode > updater.x509.pem
          mkdir -p out
          "$BT/apksigner" sign --key updater.pk8 --cert updater.x509.pem \
            --out "out/MasterROM-Updater-$VERSION_NAME.apk" aligned.apk
          rm -f updater.pk8 updater.x509.pem aligned.apk
          "$BT/apksigner" verify --print-certs "out/MasterROM-Updater-$VERSION_NAME.apk" | head -n 3
          "$BT/aapt2" dump badging "out/MasterROM-Updater-$VERSION_NAME.apk" | head -n 1
          sha256sum out/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: MasterROM-Updater-${{ env.VERSION_NAME }}
          path: out/*.apk

      - name: Publish release (self-update for the phones)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # notes = the section of this version from CHANGELOG.md
          awk -v ver="$VERSION_NAME" '/^# /{ if (p) exit; if ($2 == ver) { p = 1; next } } p' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "MasterROM Updater $VERSION_NAME" > notes.md
          cat notes.md
          gh release create "v$VERSION_NAME" out/*.apk \
            --title "MasterROM Updater $VERSION_NAME" --notes-file notes.md --latest
